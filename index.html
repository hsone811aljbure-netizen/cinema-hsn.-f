<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cine Cam</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--tx:#ececec;--dim:#8b8b8b;--ln:#2e2e2e;--rec:#e5322d;--on:#f5b50a;--pn:rgba(10,10,10,.86);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--s3:transparent calc(33.33% - .5px),#fff7 0,#fff7 calc(33.33% + .5px),transparent 0,transparent calc(66.66% - .5px),#fff7 0,#fff7 calc(66.66% + .5px),transparent 0;--sc:transparent calc(50% - .5px),#fff7 0,#fff7 calc(50% + .5px),transparent 0}
*,*:before,*:after{box-sizing:inherit}[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#000;color:var(--tx);font:500 15px/1.2 'Barlow Semi Condensed','Arial Narrow',sans-serif;font-variant-numeric:tabular-nums;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#vf{position:absolute;inset:0}
#bx{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#050505}
#bx canvas,#gr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.g3{background:linear-gradient(90deg,var(--s3)),linear-gradient(0deg,var(--s3))}
.gc{background:linear-gradient(90deg,var(--sc)),linear-gradient(0deg,var(--sc))}
#v{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#top{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;align-items:center;gap:12px;padding:8px 14px 18px;background:linear-gradient(#000c,transparent)}
#inf{color:var(--dim)}#tc{margin-left:auto;font-size:19px}
.rec #tc{color:var(--rec)}#hi{width:96px;height:36px;border-bottom:1px solid var(--ln)}
#msg{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;max-width:82%}
#msg:empty{display:none}#msg p{margin:0 0 12px;background:var(--pn);padding:10px 14px;border-radius:8px;line-height:1.35}
#bt{position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);background:linear-gradient(transparent,#000e 24%)}
#sh:empty{display:none}#sh{margin:0 10px;padding:10px 12px;background:var(--pn);border:1px solid var(--ln);border-radius:8px}
.rw{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.rw output{margin-left:auto;font-size:20px;color:var(--on)}
input[type=range]{width:100%;height:30px;accent-color:var(--on);margin:0}
.ch{border:1px solid var(--ln);border-radius:6px;padding:7px 12px}.ch.on{border-color:var(--on);color:var(--on)}
.sl{display:flex;align-items:center;gap:12px}
#pr{display:flex;overflow-x:auto;padding:6px 8px 0;scrollbar-width:none}
#pr button{flex:0 0 auto;min-width:72px;padding:6px 10px 7px;text-align:center;border-bottom:2px solid transparent}
#pr small{display:block;color:var(--dim);font-size:12px}#pr b{font-size:21px;font-weight:500}
#pr .man b{color:var(--on)}#pr .sel{border-color:var(--tx)}#pr .off{opacity:.35}
#ct{display:flex;align-items:center;justify-content:space-between;padding:8px 22px 14px}
#ct>.ch{min-width:72px;text-align:center;background:#0008}
#rb{width:70px;height:70px;border:3px solid #fff;border-radius:50%;display:grid;place-items:center}
#rb i{width:54px;height:54px;border-radius:50%;background:var(--rec);transition:.15s}
.rec #rb i{width:26px;height:26px;border-radius:6px}
#st{position:absolute;inset:0;background:#000f;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 28px}
.sp{max-width:560px;margin:auto}.sp>.rw{justify-content:space-between;margin-bottom:14px}.sp>.rw b{font-size:22px;font-weight:600}
.sr{padding:12px 0;border-top:1px solid var(--ln)}.sr>span{display:block;color:var(--dim);margin-bottom:8px}.sr .rw{margin:0}
.nt{color:var(--dim);line-height:1.4;margin-top:16px}
</style></head><body>
<div id="vf"><div id="bx"><canvas id="gl"></canvas><canvas id="ov"></canvas><div id="gr"></div></div></div>
<video id="v" playsinline muted></video>
<header id="top"><span id="inf"></span><span id="tc"></span><canvas id="hi" width="96" height="36"></canvas></header>
<div id="msg"></div>
<footer id="bt"><div id="sh"></div><nav id="pr"></nav>
<div id="ct"><button class="ch" id="pb">Photo</button><button id="rb" aria-label="Record"><i></i></button><button class="ch" id="fb">Flip</button><button class="ch" id="sb">Settings</button></div></footer>
<div id="st" hidden></div><input id="fi" type="file" accept=".cube" multiple hidden>
<script>
const $=s=>document.querySelector(s),v=$('#v'),glc=$('#gl'),ov=$('#ov'),cl=x=>x<0?0:x>1?1:x;
let S={res:1080,fps:30,br:25,grid:'off',zeb:1,pk:0,hi:1,aud:1,face:'environment',lut:-1,amt:1,torch:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('cc')||'{}'))}catch(e){}
const keep=()=>{try{localStorage.setItem('cc',JSON.stringify(S))}catch(e){}};
function msg(t,r){const m=$('#msg');m.textContent='';if(!t)return;const p=document.createElement('p');p.textContent=t;m.append(p);if(r){const b=document.createElement('button');b.className='ch';b.textContent='Try again';b.onclick=start;m.append(b)}}
const flash=t=>{msg(t);setTimeout(()=>msg(''),2200)};
const gl=glc.getContext('webgl',{antialias:false,alpha:false});if(!gl)msg('WebGL is not available on this device.');
const sh_=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x};
const pg=gl.createProgram();
gl.attachShader(pg,sh_(gl.VERTEX_SHADER,'attribute vec2 p;varying vec2 u;void main(){u=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}'));
gl.attachShader(pg,sh_(gl.FRAGMENT_SHADER,`precision highp float;varying vec2 u;uniform sampler2D v,l;uniform float n,a;uniform vec3 g;
vec3 lut(vec3 c){float s=n-1.;c=clamp(c,0.,1.)*s;float b0=floor(c.b),b1=min(b0+1.,s);vec2 q=c.rg+.5;
return mix(texture2D(l,vec2((b0*n+q.x)/(n*n),q.y/n)).rgb,texture2D(l,vec2((b1*n+q.x)/(n*n),q.y/n)).rgb,c.b-b0);}
void main(){vec3 c=clamp(texture2D(v,u).rgb*g,0.,1.);gl_FragColor=vec4(mix(c,lut(c),a),1.);}`));
gl.linkProgram(pg);gl.useProgram(pg);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const pl=gl.getAttribLocation(pg,'p');gl.enableVertexAttribArray(pl);gl.vertexAttribPointer(pl,2,gl.FLOAT,false,0,0);
const uN=gl.getUniformLocation(pg,'n'),uA=gl.getUniformLocation(pg,'a'),uG=gl.getUniformLocation(pg,'g');
for(let i=0;i<2;i++){gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,gl.createTexture());
[gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.LINEAR));
[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE))}
gl.uniform1i(gl.getUniformLocation(pg,'v'),0);gl.uniform1i(gl.getUniformLocation(pg,'l'),1);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(4));
/* LUTs */
const sm=x=>{x=cl(x);return x*x*(3-2*x)},ly=(r,g,b)=>.3*r+.59*g+.11*b;
const LUTS=[
{name:'Cine',f:(r,g,b)=>{const y=ly(r,g,b);return[sm(r)+.07*y-.02,sm(g)+.01*y,sm(b)+.07*(1-y)-.04*y]}},
{name:'Noir',f:(r,g,b)=>{const w=sm(ly(r,g,b)*1.06);return[w,w,w]}},
{name:'Warm',f:(r,g,b)=>[r*1.06+.02,g*1.01,b*.9]},
{name:'Faded',f:(r,g,b)=>{const y=ly(r,g,b);return[r,g,b].map(c=>.07+.86*(y+(c-y)*.75))}}];
function bake(f,n=17){const d=new Uint8Array(n*n*n*4),m=n-1;for(let b=0;b<n;b++)for(let g=0;g<n;g++)for(let r=0;r<n;r++){const o=f(r/m,g/m,b/m),i=(g*n*n+b*n+r)*4;d[i]=cl(o[0])*255;d[i+1]=cl(o[1])*255;d[i+2]=cl(o[2])*255;d[i+3]=255}return{n,d}}
LUTS.forEach(L=>Object.assign(L,bake(L.f)));
function parseCube(t){let n=0;const p=[];for(const ln of t.split(/\r?\n/)){const s=ln.trim();if(!s||s[0]=='#')continue;if(s.startsWith('LUT_3D_SIZE'))n=+s.split(/\s+/)[1];else if(/^[-\d.]/.test(s)){const q=s.split(/\s+/).map(Number);if(q.length>=3)p.push(q)}}
if(!n||p.length!=n*n*n)throw 0;const d=new Uint8Array(n*n*n*4);
p.forEach((q,i)=>{const r=i%n,g=(i/n|0)%n,b=i/(n*n)|0,k=(g*n*n+b*n+r)*4;d[k]=cl(q[0])*255;d[k+1]=cl(q[1])*255;d[k+2]=cl(q[2])*255;d[k+3]=255});return{n,d}}
let curN=2,GN=[1,1,1];
function kRgb(k){const t=k/100,c=x=>Math.min(255,Math.max(0,x))/255;return[t<=66?1:c(329.698727446*Math.pow(t-60,-.1332047592)),c(t<=66?99.4708025861*Math.log(t)-161.1195681661:288.1221695283*Math.pow(t-60,-.0755148492)),t>=66?1:t<=19?0:c(138.5177312231*Math.log(t-10)-305.0447927307)]}
function softWb(){if(!man.wb){GN=[1,1,1];return}const a=kRgb(5500),c=kRgb(val.wb),g=a.map((x,i)=>x/Math.max(c[i],.05)),m=Math.max(...g);GN=g.map(x=>x/m)}
function useLut(i){S.lut=i;if(i>=0){const L=LUTS[i];if(L.n*L.n>gl.getParameter(gl.MAX_TEXTURE_SIZE)){flash('That LUT is too large for this device.');S.lut=-1}else{curN=L.n;gl.activeTexture(gl.TEXTURE1);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,L.n*L.n,L.n,0,gl.RGBA,gl.UNSIGNED_BYTE,L.d)}}keep()}
$('#fi').onchange=async e=>{for(const f of e.target.files){try{const L=parseCube(await f.text());L.name=f.name.replace(/\.cube$/i,'');LUTS.push(L);useLut(LUTS.length-1)}catch(x){flash('Could not read '+f.name+'. Use a 3D .cube file.')}}e.target.value='';renderP();renderSheet()};
/* camera */
let stream,track,caps={},val={},man={exp:0,wb:0,foc:0},mr,t0,vw=0,vh=0,SW=256,SH=144,sel=null,fr=0,snap=0;
const scn=document.createElement('canvas'),sx=scn.getContext('2d',{willReadFrequently:true}),ox=ov.getContext('2d'),hx=$('#hi').getContext('2d');
const PR=[
{k:'iso',n:'ISO',cap:'iso',g:'exp',lg:1,f:x=>Math.round(x)},
{k:'sh',n:'Shutter',cap:'exposureTime',g:'exp',lg:1,f:x=>'1/'+Math.round(1e4/x)},
{k:'wb',n:'WB',cap:'colorTemperature',g:'wb',f:x=>Math.round(x)+'K'},
{k:'foc',n:'Focus',cap:'focusDistance',g:'foc',f:x=>x.toFixed(2)},
{k:'ev',n:'EV',cap:'exposureCompensation',f:x=>(x>0?'+':'')+x.toFixed(1)},
{k:'zoom',n:'Zoom',cap:'zoom',f:x=>x.toFixed(1)+'×'}];
const ap=o=>track&&track.applyConstraints({advanced:[o]}).catch(()=>{});
function push(k){
if(k=='iso'||k=='sh')ap(man.exp?{exposureMode:'manual',iso:Math.round(val.iso),exposureTime:Math.round(val.sh)}:{exposureMode:'continuous'});
else if(k=='wb'){if(caps.colorTemperature&&caps.colorTemperature.soft)softWb();else ap(man.wb?{whiteBalanceMode:'manual',colorTemperature:Math.round(val.wb)}:{whiteBalanceMode:'continuous'})}
else if(k=='foc')ap(man.foc?{focusMode:'manual',focusDistance:val.foc}:{focusMode:'continuous'});
else if(k=='ev')ap({exposureCompensation:val.ev});else if(k=='zoom')ap({zoom:val.zoom})}
function fit(){if(!vw)return;const r=$('#vf').getBoundingClientRect(),s=Math.min(r.width/vw,r.height/vh),b=$('#bx').style;b.width=vw*s+'px';b.height=vh*s+'px'}
addEventListener('resize',fit);
async function start(){
msg('Starting camera…');if(stream)stream.getTracks().forEach(t=>t.stop());S.torch=0;track=null;
const H=+S.res,vc={facingMode:{ideal:S.face},width:{ideal:Math.round(H*16/9)},height:{ideal:H},frameRate:{ideal:+S.fps}},au=S.aud?{echoCancellation:false,noiseSuppression:false,autoGainControl:false}:false;
try{try{stream=await navigator.mediaDevices.getUserMedia({video:vc,audio:au})}catch(e){if(!au)throw e;stream=await navigator.mediaDevices.getUserMedia({video:vc,audio:false})}}
catch(e){msg('Camera unavailable. Allow camera access, or open this page directly in Chrome instead of a preview.',1);return}
v.srcObject=stream;await v.play().catch(()=>{});track=stream.getVideoTracks()[0];
caps=track.getCapabilities?track.getCapabilities():{};const st=track.getSettings();if(!caps.colorTemperature)caps.colorTemperature={min:2500,max:10000,step:1,soft:1};GN=[1,1,1];
val={iso:st.iso||(caps.iso&&caps.iso.min)||100,sh:st.exposureTime||(caps.exposureTime&&caps.exposureTime.min)||100,wb:st.colorTemperature||5000,foc:st.focusDistance||0,ev:0,zoom:st.zoom||1};man={exp:0,wb:0,foc:0};
vw=v.videoWidth;vh=v.videoHeight;glc.width=vw;glc.height=vh;gl.viewport(0,0,vw,vh);SH=Math.round(SW*vh/vw);scn.width=ov.width=SW;scn.height=ov.height=SH;fit();
$('#inf').textContent=`${vw}×${vh} · ${Math.round(st.frameRate||S.fps)} fps · ${S.br} Mbps`;
sel=null;renderP();renderSheet();msg('');navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}
/* UI */
function renderP(){$('#pr').innerHTML=PR.map(p=>{const on=!!caps[p.cap],m=p.g&&man[p.g];return`<button data-k="${p.k}" class="${on?'':'off'}${m?' man':''}${sel==p.k?' sel':''}"><small>${p.n}</small><b>${on?(p.g&&!m?'Auto':p.f(val[p.k])):'—'}</b></button>`}).join('')+`<button data-k="lut" class="${S.lut>=0?'man':''}${sel=='lut'?' sel':''}"><small>LUT</small><b>${S.lut>=0?LUTS[S.lut].name:'Off'}</b></button>`}
function renderSheet(){const s=$('#sh');if(!sel){s.innerHTML='';return}
if(sel=='lut'){s.innerHTML=`<div class="rw">${['Off',...LUTS.map(l=>l.name)].map((n,i)=>`<button class="ch${S.lut==i-1?' on':''}" data-l="${i-1}"></button>`).join('')}<button class="ch" id="ld">Load .cube</button></div><label class="sl"><span>Intensity</span><input type="range" id="am" min="0" max="1" step=".01" value="${S.amt}"></label>`;
s.querySelectorAll('[data-l]').forEach((b,i)=>b.textContent=i?LUTS[i-1].name:'Off');return}
const p=PR.find(x=>x.k==sel),c=caps[p.cap],m=p.g&&man[p.g],x=val[p.k],t=p.lg&&c.min>0?Math.log(x/c.min)/Math.log(c.max/c.min):(x-c.min)/((c.max-c.min)||1);
s.innerHTML=`<div class="rw">${p.g?`<button class="ch${m?'':' on'}" data-a="0">Auto</button><button class="ch${m?' on':''}" data-a="1">Manual</button>`:''}<output>${p.f(x)}</output></div><input type="range" id="rg" min="0" max="1000" value="${Math.round((cl(t)||0)*1000)}">`}
$('#pr').onclick=e=>{const b=e.target.closest('button');if(!b||b.classList.contains('off'))return;sel=sel==b.dataset.k?null:b.dataset.k;renderP();renderSheet()};
$('#sh').onclick=e=>{const b=e.target.closest('button');if(!b)return;
if(b.id=='ld'){$('#fi').click();return}
if('l' in b.dataset){useLut(+b.dataset.l);renderP();renderSheet()}
else if('a' in b.dataset){const p=PR.find(x=>x.k==sel);man[p.g]=+b.dataset.a;push(p.k);renderP();renderSheet()}};
$('#sh').addEventListener('input',e=>{const t=e.target;if(t.id=='am'){S.amt=+t.value;keep();return}if(t.id!='rg')return;
const p=PR.find(x=>x.k==sel),c=caps[p.cap],r=t.value/1000;
val[p.k]=p.lg&&c.min>0?c.min*Math.pow(c.max/c.min,r):c.min+r*(c.max-c.min);
if(p.g&&!man[p.g]){man[p.g]=1;$('#sh').querySelectorAll('[data-a]').forEach(b=>b.classList.toggle('on',b.dataset.a=='1'))}
push(p.k);$('#sh output').textContent=p.f(val[p.k]);renderP()});
function applyUi(){$('#gr').className=S.grid==3?'g3':S.grid=='c'?'gc':'';$('#hi').style.display=S.hi?'':'none'}
function renderSt(){const o=(l,k,cs)=>`<div class="sr"><span>${l}</span><div class="rw">${cs.map(([t,x])=>`<button class="ch${S[k]==x?' on':''}" data-s="${k}" data-v="${x}">${t}</button>`).join('')}</div></div>`,oo=[['Off',0],['On',1]];
$('#st').innerHTML=`<div class="sp"><div class="rw"><b>Settings</b><button class="ch" id="sx">Done</button></div>`+o('Resolution','res',[['720p',720],['1080p',1080],['4K',2160]])+o('Frame rate','fps',[['24',24],['30',30],['60',60]])+o('Bitrate (Mbps)','br',[[10,10],[25,25],[50,50],[100,100]])+o('Grid','grid',[['Off','off'],['Thirds',3],['Center','c']])+o('Zebra','zeb',oo)+o('Focus peaking','pk',oo)+o('Histogram','hi',oo)+o('Audio','aud',oo)+(caps.torch?o('Torch','torch',oo):'')+`<p class="nt">Resolution, frame rate and audio restart the camera. Manual controls depend on your phone and browser. Recordings include the LUT and save to Downloads.</p></div>`}
$('#st').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id=='sx'){$('#st').hidden=true;return}
const k=b.dataset.s,x=isNaN(+b.dataset.v)?b.dataset.v:+b.dataset.v;S[k]=x;keep();applyUi();
if(k=='res'||k=='fps'||k=='aud')start();if(k=='torch')ap({torch:!!x});renderSt()};
$('#sb').onclick=()=>{renderSt();$('#st').hidden=false};
$('#fb').onclick=()=>{S.face=S.face=='user'?'environment':'user';keep();start()};
$('#pb').onclick=()=>{snap=1};
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),9e3);flash('Saved '+n)}
const tcs=()=>{const s=(Date.now()-t0)/1000|0;return[s/3600|0,s/60%60|0,s%60].map(x=>String(x).padStart(2,'0')).join(':')};
$('#rb').onclick=()=>{
if(mr&&mr.state=='recording'){mr.stop();return}
if(!track||typeof MediaRecorder=='undefined'){flash('Recording is not supported here.');return}
const cs=glc.captureStream(+S.fps);stream.getAudioTracks().forEach(t=>cs.addTrack(t));
const mt=['video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t))||'',ch=[];
mr=new MediaRecorder(cs,{mimeType:mt,videoBitsPerSecond:S.br*1e6});
mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
mr.onstop=()=>{document.body.classList.remove('rec');$('#tc').textContent='';dl(new Blob(ch,{type:mt||'video/webm'}),'clip-'+Date.now()+(mt.includes('mp4')?'.mp4':'.webm'))};
mr.start(1000);t0=Date.now();document.body.classList.add('rec')};
/* monitoring aids: histogram, zebra, peaking (drawn on a separate layer, never recorded) */
function aids(){if(!(S.hi||S.zeb||S.pk))return;
sx.drawImage(glc,0,0,SW,SH);const d=sx.getImageData(0,0,SW,SH).data,o=ox.createImageData(SW,SH),od=o.data,h=new Array(48).fill(0),Y=i=>.299*d[i]+.587*d[i+1]+.114*d[i+2];
for(let y=0;y<SH;y++)for(let x=0;x<SW;x++){const i=(y*SW+x)*4,l=Y(i);h[l*47/255|0]++;let c=null;
if(S.zeb&&l>240&&((x+y+fr)&3)<2)c=[255,70,70,200];
else if(S.pk&&x<SW-1&&y<SH-1&&Math.abs(l-Y(i+4))+Math.abs(l-Y(i+SW*4))>38)c=[60,255,120,230];
if(c){od[i]=c[0];od[i+1]=c[1];od[i+2]=c[2];od[i+3]=c[3]}}
ox.putImageData(o,0,0);
if(S.hi){hx.clearRect(0,0,96,36);hx.fillStyle='#ddd';const m=Math.max(...h)||1;h.forEach((c,i)=>hx.fillRect(i*2,36-c/m*36,1.5,36))}}
function loop(){requestAnimationFrame(loop);if(!track||v.readyState<2||!vw)return;
gl.activeTexture(gl.TEXTURE0);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,v);
gl.uniform1f(uN,curN);gl.uniform1f(uA,S.lut>=0?S.amt:0);gl.uniform3fv(uG,GN);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
if(snap){snap=0;glc.toBlob(b=>dl(b,'photo-'+Date.now()+'.jpg'),'image/jpeg',.95)}
if(++fr%5==0)aids();
if(mr&&mr.state=='recording')$('#tc').textContent=tcs()}
if(S.lut>=LUTS.length)S.lut=-1;useLut(S.lut);applyUi();renderP();start();loop();
</script></body></html>
